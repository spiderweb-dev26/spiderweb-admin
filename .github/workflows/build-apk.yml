name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'logo.png'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Use logo.png as the app icon (vector emblem fallback)
        working-directory: android
        run: |
          if [ -f ../logo.png ]; then
            cp ../logo.png app/src/main/res/drawable/app_icon.png
          else
            curl -fsSL -o app/src/main/res/drawable/app_icon.png https://admin.spiderweb.lol/logo.png \
              || curl -fsSL -o app/src/main/res/drawable/app_icon.png https://admin.spiderweb.lol/assets/logo.png \
              || rm -f app/src/main/res/drawable/app_icon.png
          fi
          if [ -s app/src/main/res/drawable/app_icon.png ]; then
            rm -f app/src/main/res/drawable/app_icon.xml
            echo "APP ICON: logo.png"
          else
            echo "APP ICON: built-in vector emblem (logo.png not found)"
          fi

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Spiderweb-Admin-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
